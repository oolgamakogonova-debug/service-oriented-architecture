services:

  # ══════════════════════════════════════════════════
  # Zookeeper
  # ══════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Kafka Broker 1
  # ══════════════════════════════════════════════════
  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka1
    hostname: kafka1
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9101
    volumes:
      - kafka1_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Kafka Broker 2
  # ══════════════════════════════════════════════════
  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka2
    hostname: kafka2
    restart: unless-stopped
    ports:
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9102
    volumes:
      - kafka2_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Schema Registry
  # ══════════════════════════════════════════════════
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    hostname: schema-registry
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: BACKWARD
    depends_on:
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Init Kafka
  # ══════════════════════════════════════════════════
  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: init-kafka
    depends_on:
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      schema-registry:
        condition: service_healthy
    volumes:
      - ./avro:/avro:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "═══ Creating Kafka topic ═══"
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka1:9092 \
          --topic movie-events \
          --partitions 3 \
          --replication-factor 2 \
          --config min.insync.replicas=1

        echo "═══ Topic description ═══"
        kafka-topics --describe --bootstrap-server kafka1:9092 --topic movie-events

        echo "═══ Registering Avro schema ═══"
        SCHEMA=$$(cat /avro/movie_event.avsc | sed 's/"/\\"/g' | tr -d '\n')
        curl -s -X POST http://schema-registry:8081/subjects/movie-events-value/versions \
          -H "Content-Type: application/vnd.schemaregistry.v1+json" \
          -d "{\"schemaType\": \"AVRO\", \"schema\": \"$$SCHEMA\"}"

        echo ""
        echo "═══ Registered subjects ═══"
        curl -s http://schema-registry:8081/subjects

        echo ""
        echo "═══ Init complete ═══"
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # ClickHouse
  # ══════════════════════════════════════════════════
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    depends_on:
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      schema-registry:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # PostgreSQL
  # ══════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cinema_aggregates
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_aggregates || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # MinIO
  # ══════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # MinIO Init
  # ══════════════════════════════════════════════════
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin123
        mc mb --ignore-existing local/movie-analytics
        mc anonymous set download local/movie-analytics
        echo "Bucket movie-analytics created."
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Producer
  # ══════════════════════════════════════════════════
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer
    hostname: producer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093
      KAFKA_TOPIC: movie-events
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_ACKS: all
      KAFKA_RETRIES: 5
      KAFKA_LINGER_MS: 10
      KAFKA_BATCH_SIZE: 32768
      KAFKA_BUFFER_MEMORY: 67108864
      KAFKA_COMPRESSION_TYPE: snappy
      GENERATOR_ENABLED: "true"
      GENERATOR_EVENTS_PER_SECOND: 10
      GENERATOR_NUM_USERS: 100
      GENERATOR_NUM_MOVIES: 50
    depends_on:
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      schema-registry:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Aggregation Service
  # ══════════════════════════════════════════════════
  aggregation:
    build:
      context: ./aggregation
      dockerfile: Dockerfile
    container_name: aggregation
    hostname: aggregation
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cinema_aggregates
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_secret
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: movie-analytics
      AGGREGATION_INTERVAL_SECONDS: 60
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Grafana
  # ══════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/online-cinema.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - cinema

  # ══════════════════════════════════════════════════
  # Integration Tests
  # ══════════════════════════════════════════════════
  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: tests
    environment:
      PRODUCER_URL: http://producer:8000
      AGGREGATION_URL: http://aggregation:8001
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT_EXT: "8123"
      CLICKHOUSE_URL: http://clickhouse:8123
      MINIO_ENDPOINT_EXT: http://minio:9000
      POSTGRES_DSN: "host=postgres port=5432 dbname=cinema_aggregates user=cinema password=cinema_secret"
    depends_on:
      producer:
        condition: service_healthy
      aggregation:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    profiles:
      - test
    networks:
      - cinema

volumes:
  zookeeper_data:
  zookeeper_logs:
  kafka1_data:
  kafka2_data:
  clickhouse_data:
  clickhouse_logs:
  postgres_data:
  minio_data:
  grafana_data:

networks:
  cinema:
    driver: bridge
    name: cinema-network
