# ──────────────────────────────────────────────────────────────────────
# Event-driven Warehouse Management System  + ДЗ №7 (CI/CD, Observability)
# Kafka + Schema Registry + 3-node Cassandra + WMS-API + Consumer
# + Prometheus + Alertmanager + Grafana + kafka-exporter
#
# Полный стенд (для локальной разработки и защиты): docker compose up -d
# Облегчённый стенд для CI: docker compose -f docker-compose.ci.yml up -d
# ──────────────────────────────────────────────────────────────────────

x-cassandra-common: &cassandra-common
  image: cassandra:4.1
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: WarehouseCluster
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_NUM_TOKENS: 16
    HEAP_NEWSIZE: 128M
    MAX_HEAP_SIZE: 512M
  healthcheck:
    test: ["CMD-SHELL", "/opt/cassandra/bin/nodetool status | grep -E '^UN'"]
    interval: 15s
    timeout: 10s
    retries: 30
    start_period: 90s

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "srvr,ruok"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  cassandra-1:
    <<: *cassandra-common
    container_name: cassandra-1
    hostname: cassandra-1
    ports:
      - "9042:9042"
    environment:
      <<: *cassandra-env
      CASSANDRA_SEEDS: cassandra-1
    volumes:
      - cassandra1-data:/var/lib/cassandra

  cassandra-2:
    <<: *cassandra-common
    container_name: cassandra-2
    hostname: cassandra-2
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      <<: *cassandra-env
      CASSANDRA_SEEDS: cassandra-1
    volumes:
      - cassandra2-data:/var/lib/cassandra

  cassandra-3:
    <<: *cassandra-common
    container_name: cassandra-3
    hostname: cassandra-3
    depends_on:
      cassandra-2:
        condition: service_healthy
    environment:
      <<: *cassandra-env
      CASSANDRA_SEEDS: cassandra-1
    volumes:
      - cassandra3-data:/var/lib/cassandra

  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_healthy
      cassandra-3:
        condition: service_healthy
    volumes:
      - ./cassandra:/migrations:ro
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e
        echo "Waiting for Cassandra via cqlsh..."
        until /opt/cassandra/bin/cqlsh cassandra-1 9042 -e "DESCRIBE KEYSPACES;" >/dev/null 2>&1; do
          echo "Cassandra is not ready for cqlsh yet, waiting..."
          sleep 5
        done
        echo "Applying schema..."
        /opt/cassandra/bin/cqlsh cassandra-1 9042 -f /migrations/schema.cql
        echo "Schema applied successfully."

  # ── Сервис 1: WMS-API (HTTP API gateway, write->Kafka, read->Cassandra) ──
  wms-api:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: wms-api
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OUTPUT_TOPIC: warehouse-events
      CASSANDRA_HOSTS: cassandra-1,cassandra-2,cassandra-3
      CASSANDRA_KEYSPACE: warehouse
      CASSANDRA_LOCAL_DC: dc1
      HTTP_PORT: "8080"
      MODE: "api"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ── Сервис 2: consumer (Kafka -> Cassandra) ──────────────────────
  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CASSANDRA_HOSTS: cassandra-1,cassandra-2,cassandra-3
      CASSANDRA_KEYSPACE: warehouse
      CONSUMER_GROUP: warehouse-state-consumer
      INPUT_TOPIC: warehouse-events
      DLQ_TOPIC: warehouse-events-dlq
      HTTP_PORT: "8000"
      LOG_LEVEL: INFO
    restart: unless-stopped

  # ── Одноразовый warm-up: засеять немного данных, чтобы дашборды были живыми ──
  warmup:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: warmup
    depends_on:
      wms-api:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OUTPUT_TOPIC: warehouse-events
      MODE: "demo"
      LOG_LEVEL: INFO
    restart: "no"

  # ── Инфраструктура: Kafka exporter (broker/lag/partition метрики) ──
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    depends_on:
      - alertmanager
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  cassandra1-data:
  cassandra2-data:
  cassandra3-data:
