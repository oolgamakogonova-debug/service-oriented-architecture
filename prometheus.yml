# ──────────────────────────────────────────────────────────────────
# Prometheus: сбор метрик сервисов и инфраструктуры + правила/алерты.
# ──────────────────────────────────────────────────────────────────
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/recording_rules.yml   # SLI как recording rules (п.10)
  - /etc/prometheus/alerts.yml            # alert rules (п.9)

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── Сервис 1: WMS-API (HTTP, http_* метрики) ────────────────────
  - job_name: wms-api
    metrics_path: /metrics
    static_configs:
      - targets: ["wms-api:8080"]
        labels:
          service: wms-api

  # ── Сервис 2: consumer (Kafka-аналог http_* метрик) ─────────────
  - job_name: warehouse-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["consumer:8000"]
        labels:
          service: warehouse-consumer

  # ── Инфраструктура: Kafka (broker status, lag, partitions) ──────
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: kafka

  # ── Сам Prometheus ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
