# ──────────────────────────────────────────────────────────────────
# Alertmanager (ДЗ №7, п.9). Маршрутизация алертов.
# Получатель — webhook-заглушка (для демо firing достаточно UI Alertmanager).
# В реальной системе сюда подключают Slack/Telegram/email/PagerDuty.
# ──────────────────────────────────────────────────────────────────
global:
  resolve_timeout: 1m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      group_wait: 5s

receivers:
  - name: default
    # Заглушка: алерты видны в UI Alertmanager (http://localhost:9093).
    webhook_configs:
      - url: "http://alertmanager:9093/-/healthy"
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: "http://alertmanager:9093/-/healthy"
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname"]
